name: build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  build:
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.result != 'failure' }}
    permissions:
      contents: write
    uses: sruon/Ashita4-plugin-ci/.github/workflows/build-plugin.yml@v1
    with:
      targets: zonetrace
      output-dir-variable: ZONETRACE_OUTPUT_DIR
      install-dir: polplugins
      release-tag: ${{ needs.release-please.outputs.release_created && needs.release-please.outputs.tag_name || '' }}
